<html lang="ca">
<head>
<meta charset="utf-8">

<title>Martí ❤️ Maria · Es nostre raconet</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== COLORS (mode clar per defecte; fosc automàtic o manual) ===== */
:root{
  --bg:#fff0f4; --bg2:#ffe0e8; --card:#ffffff; --text:#4a2330; --muted:#8a5a68;
  --rose:#f4a6b9; --red:#d94b66; --yellow:#f9dc7c; --line:#f6cdd7; --shadow:0 8px 24px rgba(217,75,102,.15);
  --script:'Dancing Script','Brush Script MT',cursive; --sans:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2a1620;--bg2:#3a1f2b;--card:#432633;--text:#ffe8ee;--muted:#e0b3c0;--rose:#c9738a;--red:#f07a92;--yellow:#e8c75f;--line:#5a3343;--shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#2a1620;--bg2:#3a1f2b;--card:#432633;--text:#ffe8ee;--muted:#e0b3c0;--rose:#c9738a;--red:#f07a92;--yellow:#e8c75f;--line:#5a3343;--shadow:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;overflow-x:hidden;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:var(--script);font-weight:700;margin:0}
section{padding:80px 18px 40px;max-width:960px;margin:0 auto}
h2{margin-bottom:18px;font-size:clamp(2.2rem,8vw,3.2rem);color:var(--red);text-align:center}
.sub{text-align:center;color:var(--muted);margin:4px 0 28px}
/* ===== NAV ===== */
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;gap:4px;align-items:center;padding:8px 10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .links{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav .links::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--text);padding:6px 11px;border-radius:99px;font-size:.88rem;font-weight:600}
nav a:hover{background:var(--bg2)}
nav button{border:0;background:var(--bg2);border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer;flex:none}
/* ===== PORTADA ===== */
#portada{min-height:100vh;max-width:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 20%,var(--bg2),var(--bg) 70%)}
#portada h1{font-size:clamp(2.8rem,13vw,6rem);color:var(--red);line-height:1.1;position:relative;z-index:2}
#portada h1 span{color:var(--rose)}
.frase{font-size:1.15rem;max-width:520px;color:var(--muted);position:relative;z-index:2;margin:14px 0 28px}
.comptador{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:520px;position:relative;z-index:2}
.comptador div{background:var(--card);border-radius:16px;padding:12px 4px;box-shadow:var(--shadow);border-top:4px solid var(--yellow)}
.comptador b{display:block;font-size:clamp(1.4rem,6vw,2.1rem);color:var(--red)}
.comptador small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.floater{position:absolute;bottom:-40px;animation:float linear infinite;opacity:.55;z-index:1;pointer-events:none}
@keyframes float{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
/* ===== TARGETES ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.9rem;color:var(--red)}
.card p{margin:0;color:var(--muted);flex:1}
.btn{display:inline-block;align-self:flex-start;background:var(--red);color:#fff;text-decoration:none;border:0;border-radius:99px;padding:10px 20px;font:600 .95rem var(--sans);cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn.off{background:var(--line);color:var(--muted);cursor:default;pointer-events:none}
/* ===== CARTES ===== */
.carta{background:var(--card);border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.carta>button{all:unset;display:flex;align-items:center;gap:14px;padding:18px;width:100%;box-sizing:border-box;cursor:pointer}
.carta .env{font-size:2.2rem;transition:transform .4s}
.carta.open .env{transform:rotate(-12deg) scale(1.15)}
.carta h3{font-size:1.7rem;color:var(--red)}
.carta small{color:var(--muted)}
.paper{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s ease}
.carta.open .paper{grid-template-rows:1fr}
.paper>div{overflow:hidden}
.paper p{margin:0 14px 14px;padding:22px;white-space:pre-line;background:linear-gradient(#fff8e6,#fdeec4);color:#4a3320;border-radius:6px;font-size:1.05rem;box-shadow:inset 0 0 30px rgba(200,150,60,.2)}
/* ===== CALENDARI ===== */
.cor-fons{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:40}
.cor-cai{position:absolute;top:-80px;animation:cai ease-in-out forwards;will-change:transform,opacity}
@keyframes cai{
  0%{transform:translate(0,0) rotate(-15deg);opacity:0;filter:blur(0)}
  12%{opacity:.85}
  30%{transform:translate(var(--dx),calc(var(--fall)*.3)) rotate(15deg)}
  60%{transform:translate(calc(var(--dx)*-1),calc(var(--fall)*.6)) rotate(-15deg);opacity:.7}
  100%{transform:translate(0,var(--fall)) rotate(10deg);opacity:0;filter:blur(7px)}
}
.cal-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.cal-top button,.cal-top select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 14px;font:600 1rem var(--sans);cursor:pointer}
.cal-top h3{font-size:2rem;min-width:140px;text-align:center;color:var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid .h{text-align:center;font-weight:600;color:var(--muted);font-size:.8rem}
.d{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;position:relative}
.d.blank{background:none;border:0}
.d.today{outline:2px solid var(--red)}
.d i{font-style:normal;font-size:1rem;line-height:1}
.d.ev{cursor:pointer;color:#4a2330;font-weight:700}
.d.mes{background:var(--rose)} .d.her{background:var(--yellow)} .d.me{background:#ffc9a8}
.d.esp{background:#ff9a9a} .d.any{background:linear-gradient(135deg,#ffe27a,#f4a6b9);animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin:16px 0;font-size:.85rem;color:var(--muted)}
.msg:empty{display:none}
.msg{min-height:60px;text-align:center;background:var(--card);border:2px dashed var(--rose);border-radius:16px;padding:16px;font-size:1.1rem}
/* ===== PARAULES ===== */
form{display:grid;gap:10px;background:var(--card);padding:18px;border-radius:20px;box-shadow:var(--shadow);margin-bottom:22px}
form input,form textarea,form select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:1rem var(--sans)}
.row{display:grid;grid-template-columns:1fr 90px;gap:10px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.note{background:linear-gradient(150deg,#ff9db4,#e0536d);color:#fff;padding:20px 18px 16px 46px;border-radius:18px;box-shadow:0 12px 28px rgba(217,75,102,.35);position:relative;overflow:hidden;animation:bob 5s ease-in-out infinite alternate}
.note::before{content:"";position:absolute;top:0;left:20px;width:14px;height:100%;background:var(--yellow);opacity:.9}
.note:nth-child(even){animation-delay:-2.5s;animation-duration:6.5s}
@keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-9px) rotate(1deg)}}
.note p{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.note small{opacity:.75}
.note button{position:absolute;top:6px;right:8px;border:0;background:none;font-size:1.1rem;cursor:pointer;color:inherit}
footer{text-align:center;padding:40px 18px 50px;color:var(--muted);font-size:1.05rem}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<nav>

<section id="portada">

<script>
/* =====================================================
   DADES PERSONALS — modifica només aquesta part
   ===================================================== */
const CONFIG = {
  jo: "Martí Amate Monserrat",         // nom complet (a sa portada surt es primer)
  ella: "Maria Hinojosa Soler",
  iniciHora: "19:15",                // hora a què vam començar a sortir
  inici: "2026-02-22",                 // AAAA-MM-DD en què vam començar
  aniversariJo: { mes: 2, dia: 14 },

  // Altres dates especials: any, mes, dia, icona, missatge
  especials: [
    { any: 2026, mes: 4, dia: 16, icona: "🔥", text: "Una data que només sabem nosaltres dos… 🔥🔥🔥" }
  ]
};

// Per afegir una llista nova, copia una línia:
const LLISTES = [
  { nom: "Loml", desc: "Sa llista de ses cançons que em fan pensar només en tu.", url: "https://open.spotify.com/playlist/4i66AJ0HBp0EcxykON9wRv?si=RxPfUI3bSfW-IHULb40XWg" },
  { nom: "Sa meva vida💝💝", desc: "Ses cançons que sonen quan et tenc davant: sa nostra vida en música.", url: "https://open.spotify.com/playlist/4Hk1FfUHPVWX1Lc2YdbnPC?si=WiouvlejRKOIcBrbtpZC5Q" }
];

// Per afegir un lloc nou, copia una línia (mapa "" = encara no disponible):
const LLOCS = [
  { nom: "Es convent", historia: "Es millor banc per no deixar de xerrar amb tu.", mapa: "https://maps.app.goo.gl/m37z2GfiycbjzLM38" },
  { nom: "Parc Municipal Fela", historia: "Saps es que va passar a carnaval… 😏", mapa: "https://maps.app.goo.gl/E8yebXQgtYAk1mVA8" },
  { nom: "Plaça des Pedregar", historia: "Aviat t’explicaré per què és tan especial per a noltros.", mapa: "https://maps.app.goo.gl/oyA6xhk43hK5nFxQ7" }
];

// Per afegir una carta nova, copia un bloc:
const CARTES = [
  { titol: "Carta 1", data: "", text: `Hola Maria, bé, avui m’ha pegat per escriure’t això perquè simplement tenia ganes de dir-te algunes coses que a vegades no sé com dir-te en persona.

No sé molt bé com explicar tot lo que sent per tu, perquè per molt que escrigui trob que me qued curt. T’estim moltíssim, més del que segurament te dic i més del que jo mateix sé explicar. I és que t’has convertit en una persona tan important per jo que ara mateix no puc imaginar-me es meu dia a dia sense tu.

És un poc raro perquè puc estar fent qualsevol cosa i de cop pensar en tu. Tant si estam xerrant, rient, fent es coio, fent alguna de ses nostres tonteries o simplement estam junts sense fer res. M’agrada molt estar amb tu, però sobretot m’agrada poder ser jo mateix quan estic amb tu.

També sé que no som perfecte i que a vegades puc fer o dir coses que no toquen, o simplement no saber com expressar lo que sent. Però hi ha una cosa de sa qual no vull que dubtis mai, i és que t’estim de veres. Cada vegada que t’ho dic ho dic perquè ho sent, no perquè quedi bé dir-ho.

I vull que sàpigues que jo no vull estar amb tu només quan tot va bé. Vull estar quan estiguis contenta i tenguis ganes de riure, però també quan tenguis un dia de merda, quan estiguis preocupada o quan simplement necessitis qualcú que estigui allà. Vull poder ser aquella persona amb qui puguis xerrar de qualsevol cosa sense por i que sàpigues que no te deixaré tirada.

No sé què passarà demà ni tot lo que ens queda per viure, però tampoc necessit saber-ho ara mateix. Jo sé que ara t’estim, que m’importes moltíssim i que vull seguir compartint coses amb tu. I si demà, passat demà o d’aquí molt de temps me tornassin a demanar a qui vull tenir al meu costat, segurament te tornaria a elegir a tu.

Hi ha moltíssima gent en aquest món, però jo he tengut la sort de trobar-te a tu. I encara que a vegades no te ho digui, valor moltíssim tenir-te a sa meva vida.

Així que simplement gràcies. Gràcies per fer-me riure, per aguantar ses meves tonteries, per tots es moments que hem passat junts i per ser com ets amb jo.

I no sé si tot això té molt de sentit, però simplement volia que tinguessis aquest petit detall i que recordassis una cosa:

T’estim molt, Maria. I encara que passin es mesos, canvin ses coses o ens passin milions de coses, jo te seguiré estimant. 💝💝

T’estim més que tu. 💝` },
  { titol: "Carta 2", data: "", text: `Buenooo bebeee, ja saps que et volia escriure una altra cosa guapaaa i aquí la tenssss.

Saps bebe? A vegades estic fent qualsevol cosa i de cop pens amb tu i amb sa sort que he tengut de trobar-te (això òbviament me provoca un somriure que no és ni mig normal eh). És un poc raro pensar que entre tanta gent que hi ha, justament tu hagis acabat formant part de sa meva vida d’aquesta manera. I sincerament no ho canviaria per res ja que ets el millor que ha passat a la meva vida, ets el motiu pel qual tenc ganes de fer coses, el motiu perquè me despert feliç, ja que et tenc a tu, un simple missatge teu m’alegra el pitjor dia de la meva vida.

No sé si te dones compte de lo important que ets per jo. No és només perquè siguis sa meva al·lota, és perquè t’has convertit en una persona que necessit dins es meu dia a dia. Me fa ganes contar-te qualsevol tonteria que me passa, xerrar amb tu encara que no tenguem res a dir i simplement estar amb tu.

I bebè, hi ha una cosa que vull que tenguis molt clara. No ets difícil d’estimar. No ets una mala persona, no ets una mala germana, ni una mala amiga, ni res de tot això que qualque vegada puguis arribar a pensar de tu mateixa. Que tenguis dies dolents, que t’equivoquis o que facis coses que després no t’agradin no vol dir que siguis una mala persona.

Jo sé que a vegades tu mateixa ets massa dura amb tu i te mires d’una manera que jo no puc ni entendre, ja que quan te mir veig una persona perfecta i meravellosa (sa futura mare dels meus fills i sa persona amb sa qual vull compartir tota sa meva vida). M’encanta sa teva manera de ser, ses teves tonteries, com rius, com xerram, com me provoques i fins i tot ses coses que segurament a tu no t’agraden de tu o et poden causar inseguretat.

No necessit que siguis perfecta amb jo. No necessit que sempre estiguis bé ni que sempre sàpigues què dir o què fer. Simplement vull que siguis tu. I si qualque dia no te veus amb bons ulls, jo intentaré recordar-te ses coses bones que tu no ets capaç de veure.

També vull que sàpigues que me preocupes molt. A vegades te deman si has menjat, si has dormit bé o si estàs bé i pot parèixer una tonteria, però me surt sol. Quan qualcú t’importa de veres, supòs que te preocupes per aquestes coses sense pensar-hi.

I no vull estar només per ses coses bones. Si tens un dia de merda, si estàs preocupada per qualque cosa, si necessites plorar o simplement no tens ganes de xerrar amb ningú, jo vull estar allà igualment. Potser no sabré arreglar lo que te passa, però almenys no ho hauràs de passar tota sola.

Mira, ara mateix sé que t’estim, que m’importes moltíssim, que no canviaria sa persona que tenc al meu costat, que vull estar amb tu durant tota sa meva vida i que no me puc imaginar una vida sense tu devora meva.

I encara que a vegades no t’ho digui o no t’ho sàpiga demostrar, esper que sàpigues que estic molt orgullós de tu i de sa persona que ets. I sobretot, que mai pensis que ets poc per jo, perquè no ho ets ni de lluny.

Que t’estim molt, bebè. I esper que no ho dubtis mai.

Gràcies per estar a sa meva vida mi amor, t’estim moltíssimmmm 💝💝💝💝` },
  { titol: "Carta 3", data: "2026-10-31", text: `Buenoooo bebeee, avui és es teu dia i no podia deixar passar s’ocasió sense escriure’t una carteta guapaaa.

Primer de tot, molts d’anys, Maria. Esper que avui tenguis un dia tan guapo com tu i que puguis estar amb sa gent que t’estima i fer tot allò que te faci feliç. Te mereixes que avui te cuidin molt, que riguis moltíssim i que per un dia no te preocupis de res.

I mira, mentre pensava què escriure’t, m’han vengut al cap molts de moments nostres. Des de ses caminades i ses nostres aventures, fins a aquelles estones asseguts davant es convent, donant menjar als moixos o simplement fent es coio per qualsevol banda. També es carrer del dimoni i totes ses tonteries que hem arribat a dir, inclòs en Cachopin. Són coses que me fan somriure només de pensar-hi.

I crec que això és lo que més m’agrada de noltros: que no necessitam fer res extraordinari perquè un moment amb tu sigui especial. A vegades basta estar junts, xerrar de qualsevol cosa, riure per una tonteria o simplement tenir-te devora. I al final, sense adonar-me’n, hem anat acumulant un munt de moments que ja són nostres, i que esper poder recordar durant moltíssim de temps.

Però avui no només vull pensar en tot lo que ja hem viscut, sinó també en tot lo que encara mos queda. Encara tenim un munt de llocs per descobrir, coses per provar, tonteries per fer i moments que encara no sabem ni que acabaran sent records importants. Vull més caminades amb tu, més estones sense fer res, més rialles per qualsevol tonteria i més dies d’aquests que pareixen normals però que després acabes recordant amb un somriure.

No sé com seran es pròxims anys ni totes ses coses que mos passaran, però sí que sé que me fa molta il·lusió poder compartir-ne una part amb tu. Vull veure’t créixer, aconseguir ses coses que te proposes i estar devora tu tant en es dies guapos com en aquells que no ho siguin tant. I sobretot, vull que mai deixis de ser tu, amb ses teves tonteries, sa teva manera de riure i totes aquelles coses que te fan ser sa persona que jo estim.

Esper que aquest nou any de sa teva vida te dugui un munt de coses bones, que tenguis motius per estar orgullosa de tu mateixa i que, quan tenguis un dia difícil, recordis que no l’has de passar tota sola. I si avui pogués demanar una cosa per tu, seria que poguessis veure’t amb els ulls amb què te veig jo, perquè de veres que ets una persona molt especial.

Gràcies per tots es moments que ja m’has regalat, per ses rialles, per ses converses, per ses nostres aventures i per fer que fins i tot ses coses més simples siguin guapes quan estic amb tu. I gràcies també per tots es moments que encara no hem viscut, però que esper que arribin.

Molts d’anys, bebè. T’estim moltíssim, i esper que aquesta sigui només una de ses moltes cartes que encara te podré escriure en es teus pròxims aniversaris.

I ara gaudeix molt des teu dia, que avui sa protagonista ets tuuu.

T’estim més que tu 💝💝💝` }
];

/* ===================== CODI ===================== */
const MESOS = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
const DIES = ["dl","dt","dc","dj","dv","ds","dg"];
const $ = id => document.getElementById(id);
const [sy, sm, sd] = CONFIG.inici.split("-").map(Number);   // sm: 1-12
const [sh, smin] = CONFIG.iniciHora.split(":").map(Number);
const INICI = new Date(sy, sm - 1, sd, sh, smin);
const primerNom = n => n.split(" ")[0];
$("titol").innerHTML = `${primerNom(CONFIG.jo)} <span>&amp;</span> ${primerNom(CONFIG.ella)}`;
$("firma").textContent = CONFIG.firma;
document.title = `${primerNom(CONFIG.jo)} ❤️ ${primerNom(CONFIG.ella)} · Es nostre raconet`;

/* ---- Mode clar/fosc ---- */
const root = document.documentElement;
function setTema(t){ root.setAttribute("data-theme", t); $("tema").textContent = t === "dark" ? "☀️" : "🌙"; try{ localStorage.setItem("tema", t); }catch(e){} }
let tGuardat = null; try{ tGuardat = localStorage.getItem("tema"); }catch(e){}
setTema(tGuardat || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("tema").onclick = () => setTema(root.getAttribute("data-theme") === "dark" ? "light" : "dark");

/* ---- Comptador en directe ---- */
function diferencia(a, b){
  if (b < a) return [0,0,0,0,0];
  let y=b.getFullYear()-a.getFullYear(), mo=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate(),
      h=b.getHours()-a.getHours(), mi=b.getMinutes()-a.getMinutes();
  if (mi<0){mi+=60;h--} if (h<0){h+=24;d--}
  if (d<0){d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();mo--}
  if (mo<0){mo+=12;y--}
  return [y,mo,d,h,mi];
}
function pintaComptador(){
  const v = diferencia(INICI, new Date()), et = ["anys","mesos","dies","hores","minuts"];
  $("comptador").innerHTML = v.map((n,i) => `<div><b>${n}</b><small>${et[i]}</small></div>`).join("");
}
pintaComptador(); setInterval(pintaComptador, 15000);

/* ---- Cors que suren ---- */
for (let i = 0; i < 16; i++){
  const s = document.createElement("span");
  s.className = "floater"; s.textContent = ["💗","💖","💕","🌸"][i % 4];
  s.style.cssText = `left:${Math.random()*95}%;font-size:${14+Math.random()*22}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*15}s`;
  $("portada").appendChild(s);
}

/* ---- Llistes i llocs ---- */
$("llistes").innerHTML = LLISTES.map(l => `<div class="card reveal"><h3>🎧 ${l.nom}</h3><p>${l.desc}</p>
  <a class="btn" href="${l.url}" target="_blank" rel="noopener">Escoltar a Spotify</a></div>`).join("");
$("llocsGrid").innerHTML = LLOCS.map(l => `<div class="card reveal"><h3>📍 ${l.nom}</h3><p>${l.historia}</p>
  ${l.mapa ? `<a class="btn" href="${l.mapa}" target="_blank" rel="noopener">Veure al mapa</a>` : `<span class="btn off">Aviat…</span>`}</div>`).join("");

/* ---- Cartes ---- */
const fData = s => { const [y,m,d] = s.split("-").map(Number); return `${d} de ${MESOS[m-1]} de ${y}`; };
CARTES.forEach(c => {
  const el = document.createElement("article");
  el.className = "carta reveal";
  el.innerHTML = `<button aria-expanded="false"><span class="env">💌</span><span><h3></h3><small></small></span></button>
    <div class="paper"><div><p></p></div></div>`;
  el.querySelector("h3").textContent = c.titol;
  el.querySelector("small").textContent = c.data ? fData(c.data) : "";
  el.querySelector("p").textContent = c.text;
  el.querySelector("button").onclick = e => {
    const o = el.classList.toggle("open");
    e.currentTarget.setAttribute("aria-expanded", o);
    el.querySelector(".env").textContent = o ? "💖" : "💌";
  };
  $("cartesGrid").appendChild(el);
});

/* ---- Calendari ---- */
const avui = new Date();
let vistaAny = avui.getFullYear(), vistaMes = avui.getMonth();   // mes 0-11
for (let y = sy; y <= sy + 30; y++) $("anySel").add(new Option(y, y));

// Retorna els esdeveniments d'un dia concret (mes 1-12)
function esdeveniments(y, m, d){
  const r = [];
  if (y === sy && m === sm && d === sd)
    r.push({ cls:"any", icona:"💍", text:`Avui, ${fData(CONFIG.inici)}, va començar sa nostra història, cap a ses ${CONFIG.iniciHora}. 💖` });
  const mesos = (y - sy) * 12 + (m - sm);
  if (d === sd && mesos > 0){
    if (mesos % 12 === 0) r.push({ cls:"any", icona:"💍", text:`Ja ${mesos/12} ${mesos/12===1?"any":"anys"}?? Tant de temps duuus aguantant-me?? 💍✨` });
    else r.push({ cls:"mes", icona:"💗", text:`Avui fem ${mesos} ${mesos===1?"mes":"mesos"} junts! T’estim més que ahir, i menys que demà. 💗` });
  }
  if (m === CONFIG.aniversariElla.mes && d === CONFIG.aniversariElla.dia)
    r.push({ cls:"her", icona:"🎂", sense:true, text:"Moltsss d’anysss mi niñaaa" });
  if (m === CONFIG.aniversariJo.mes && d === CONFIG.aniversariJo.dia)
    r.push({ cls:"me", icona:"🎂", sense:true, text:"Avui faig anyssss, saps que el millor regal ets tu no??" });
  CONFIG.especials.forEach(e => { if (e.any===y && e.mes===m && e.dia===d) r.push({ cls:"esp", icona:e.icona, text:e.text }); });
  return r;
}
function pintaCalendari(){
  $("mesNom").textContent = MESOS[vistaMes]; $("anySel").value = vistaAny;
  const g = $("calGrid"); g.innerHTML = DIES.map(d => `<div class="h">${d}</div>`).join("");
  const offset = (new Date(vistaAny, vistaMes, 1).getDay() + 6) % 7;   // dilluns primer
  const total = new Date(vistaAny, vistaMes + 1, 0).getDate();
  for (let i = 0; i < offset; i++) g.insertAdjacentHTML("beforeend", `<div class="d blank"></div>`);
  for (let d = 1; d <= total; d++){
    const ev = esdeveniments(vistaAny, vistaMes + 1, d);
    const el = document.createElement("div");
    const esAvui = d===avui.getDate() && vistaMes===avui.getMonth() && vistaAny===avui.getFullYear();
    el.className = "d" + (esAvui ? " today" : "") + (ev.length ? " ev " + ev[0].cls : "");
    el.innerHTML = `<span>${d}</span>` + (ev.length ? `<i>${ev.map(e=>e.icona).join("")}</i>` : "");
    if (ev.length) el.onclick = () => { $("calMsg").innerHTML = ev.map(e => `<div>${e.sense ? "" : e.icona + " "}${e.text}</div>`).join(""); };
    g.appendChild(el);
  }
}
function canviaMes(n){
  vistaMes += n;
  if (vistaMes > 11){ vistaMes = 0; vistaAny++; } if (vistaMes < 0){ vistaMes = 11; vistaAny--; }
  if (vistaAny < sy){ vistaAny = sy; vistaMes = 0; } if (vistaAny > sy + 30){ vistaAny = sy + 30; vistaMes = 11; }
  pintaCalendari();
}
$("prev").onclick = () => canviaMes(-1); $("next").onclick = () => canviaMes(1);
$("anySel").onchange = e => { vistaAny = +e.target.value; pintaCalendari(); };
if (vistaAny < sy) vistaAny = sy;
pintaCalendari();

/* ---- Cors 💝 que cauen per tota sa pàgina ---- */
(function(){
  const fons = $("corFons");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  function neix(delay){
    if (document.hidden) return;
    const c = document.createElement("span");
    c.className = "cor-cai"; c.textContent = "💝";
    const dx = 20 + Math.random() * 50;
    c.style.cssText = `left:${Math.random()*90}%;font-size:${26+Math.random()*34}px;animation-duration:${8+Math.random()*6}s;animation-delay:${delay||0}s;--dx:${Math.random()<.5?-dx:dx}px;--fall:${innerHeight+90}px`;
    c.addEventListener("animationend", () => c.remove());
    fons.appendChild(c);
  }
  for (let i = 0; i < 14; i++) neix(-Math.random() * 10);
  setInterval(() => neix(0), 350);
})();

/* ---- Paraules bones (localStorage) ---- */
const CLAU = "paraules-bones";
const llegeix = () => { try { return JSON.parse(localStorage.getItem(CLAU)) || []; } catch(e){ return []; } };
const guarda = l => { try { localStorage.setItem(CLAU, JSON.stringify(l)); } catch(e){} };
function pintaNotes(){
  const cont = $("notes"), llista = llegeix(); cont.innerHTML = "";
  if (!llista.length) return;
  llista.forEach(n => {
    const el = document.createElement("div"); el.className = "note";
    const b = document.createElement("button"); b.textContent = "✕"; b.title = "Esborrar";
    b.onclick = () => { guarda(llegeix().filter(x => x.id !== n.id)); pintaNotes(); };
    const p = document.createElement("p"); p.textContent = `${n.emoji} ${n.text}`;
    const s = document.createElement("small"); s.textContent = `${n.nom || "Algú que t’estima"} · ${new Date(n.id).toLocaleDateString("ca-ES")}`;
    el.append(b, p, s); cont.appendChild(el);
  });
}
$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("fText").value.trim(); if (!text) return;
  const l = llegeix(); l.unshift({ id: Date.now(), nom: $("fNom").value.trim(), emoji: $("fEmoji").value, text });
  guarda(l); $("form").reset(); pintaNotes();
};
pintaNotes();

/* ---- Aparició en fer scroll ---- */
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .15 });
document.querySelectorAll(".reveal,section h2,.sub").forEach(el => { el.classList.add("reveal"); io.observe(el); });
</script>
</body>
